name: CI

on:
  pull_request:
    branches: [master, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # external/ui-labs: the DevFlow agent and driver the UI tests use. Checked out separately, because
      # maui-labs inside it has paths longer than Windows allows unless core.longpaths is set.
      - name: Checkout submodules
        shell: bash
        run: |
          git config --global core.longpaths true
          git submodule update --init --recursive --depth 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore source/AvalonDock.sln

      - name: Build
        run: dotnet build source/AvalonDock.sln --configuration Release --no-restore --warnaserror

      - name: Test (Unit Tests)
        run: >
          dotnet test source/AvalonDock.sln
          --configuration Release
          --no-restore
          --filter "Category!=UI"
          --logger "trx;LogFilePrefix=unit-test-results"
          --results-directory TestResults
          -m:1

      # The DevFlow UI tests against the WPF builds of the demo applications. avalonia.yml runs the same
      # tests against the Avalonia builds on Windows, macOS and Linux.
      - name: Test (UI Tests, WPF)
        env:
          AVALONDOCK_UI: wpf
          AVALONDOCK_UI_ARTIFACTS: ${{ github.workspace }}/TestResults/ui-artifacts
        run: >
          dotnet test source/AutomationTest/AvalonDock.UITests/AvalonDock.UITests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFilePrefix=ui-test-results-wpf"
          --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            TestResults/*.trx
            TestResults/ui-artifacts
          retention-days: 14
